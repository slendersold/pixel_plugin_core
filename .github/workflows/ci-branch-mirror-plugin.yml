# Не-main ветки: плагин зеркала на C (`mirror_c`).
name: CI branch · mirror_c (C plugin)

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "mirror_c/**"
      - ".github/workflows/ci-branch-mirror-plugin.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  mirror_c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build mirror_c
        run: gcc -shared -fPIC -O2 -Wall -Wextra -o target/debug/libmirror_c.so mirror_c/mirror.c

      - name: Format (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Check (workspace)
        run: cargo check --workspace
