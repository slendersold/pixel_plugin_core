# Не-main ветки: только плагин mirror_plugin (cdylib).
name: CI branch · mirror_plugin

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "mirror_plugin/**"
      - ".github/workflows/ci-branch-mirror-plugin.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  mirror_plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p mirror_plugin --all-targets --no-deps -- -D warnings

      - name: Build
        run: cargo build -p mirror_plugin

      - name: Tests
        run: cargo test -p mirror_plugin
