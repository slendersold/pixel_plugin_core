# Не-main ветки: изменился только корневой манифест воркспейса.
name: CI branch · workspace manifest

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "Cargo.toml"
      - ".github/workflows/ci-branch-workspace-manifest.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Install toolchains for C / Go plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential golang-go

      - name: Build (workspace)
        run: cargo build --workspace

      - name: Tests (workspace)
        run: cargo test --workspace
