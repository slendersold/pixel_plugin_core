[package]
name = "image_processor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI для обработки PNG через динамически подключаемые плагины (FFI)."

[[bin]]
name = "image_processor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
libloading = "0.8"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
